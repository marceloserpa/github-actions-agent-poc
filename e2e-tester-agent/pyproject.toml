[project]
name = "e2e-tester-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "jdev.marcelo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "pydantic>=2.13.5",
    "strands-agents>=1.56.0",
    "strands-agents-tools>=0.8.9",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
e2e-tester-agent = "e2e_tester_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
